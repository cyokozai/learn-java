name: CI for Java

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'
      
      - name: Run java program
        run: |
          for file in $(find . -name "./*/main.java"); do
            echo "Compiling $file"
            javac $file

            echo "Running $file"
            java ${file
          done